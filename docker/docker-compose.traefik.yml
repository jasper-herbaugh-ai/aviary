services:
  postgres:
    image: postgres:18
    env_file:
      - stack.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aviary}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aviary}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    image: ghcr.io/robertherbaugh/merlin:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aviary}-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aviary}
    env_file:
      - stack.env
    expose:
      - "${API_PORT:-4000}"
      - "${API_GRPC_PORT:-50051}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.aviary-api.rule=Host(`${AVIARY_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/swagger`))"
      - "traefik.http.routers.aviary-api.entrypoints=websecure"
      - "traefik.http.routers.aviary-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.aviary-api.loadbalancer.server.port=${API_PORT:-4000}"

  web:
    image: ghcr.io/robertherbaugh/perch:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aviary}-web
    env_file:
      - stack.env
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.aviary-web.rule=Host(`${AVIARY_DOMAIN}`)"
      - "traefik.http.routers.aviary-web.entrypoints=websecure"
      - "traefik.http.routers.aviary-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.aviary-web.loadbalancer.server.port=3000"
      # Lower priority so api routes match first
      - "traefik.http.routers.aviary-web.priority=1"

  worker:
    image: ghcr.io/robertherbaugh/swift:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aviary}-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aviary}
    env_file:
      - stack.env
    depends_on:
      - api
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-aviary}-network
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
