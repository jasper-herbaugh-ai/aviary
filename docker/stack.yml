services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aviary}
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    image: aviary/api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aviary}
      API_PORT: ${API_PORT:-4000}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: aviary/web:latest
    ports:
      - target: 3000
        published: ${WEB_PORT:-3000}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker:
    image: aviary/worker:latest
    environment:
      WORKER_API_BASE_URL: ${WORKER_API_BASE_URL:-http://api:4000}
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
