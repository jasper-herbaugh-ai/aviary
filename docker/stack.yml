services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aviary}
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    image: aviary/api:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aviary}
      NEXT_PUBLIC_API_BASE_URL: http://${AVIARY_DOMAIN}
      API_PORT: ${API_PORT:-4000}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: aviary/web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://${AVIARY_DOMAIN}
    ports:
      - target: 3000
        published: ${WEB_PORT:-3000}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker:
    image: aviary/worker:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aviary}
      WORKER_API_BASE_URL: http://${COMPOSE_PROJECT_NAME:-aviary}-api:${API_PORT:-4000}
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
