services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aviary}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aviary}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aviary}
      API_PORT: ${API_PORT:-4000}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
      - "${API_GRPC_PORT:-50051}:${API_GRPC_PORT:-50051}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const r = await fetch(\"http://localhost:${API_PORT:-4000}/health\"); if (!r.ok) process.exit(1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: apps/web/docker/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/worker/docker/Dockerfile
    env_file:
      - ../.env
    environment:
      WORKER_API_BASE_URL: ${WORKER_API_BASE_URL:-http://api:4000}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
