services:
  postgres:
    image: postgres:18
    env_file:
      - stack.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aviary}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aviary}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    image: ghcr.io/robertherbaugh/merlin:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aviary}-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aviary}
      NEXT_PUBLIC_API_BASE_URL: http://${AVIARY_DOMAIN}
    env_file:
      - .env
    ports:
      - "${API_PORT:-4000}:4000"
      - "${API_GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const r = await fetch(\"http://localhost:${API_PORT:-4000}/health\"); if (!r.ok) process.exit(1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    image: ghcr.io/robertherbaugh/perch:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aviary}-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://${AVIARY_DOMAIN}
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  worker:
    image: ghcr.io/robertherbaugh/swift:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aviary}-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aviary}
      WORKER_API_BASE_URL: http://${COMPOSE_PROJECT_NAME:-aviary}-api:${API_PORT:-4000}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-aviary}-network
    driver: bridge
