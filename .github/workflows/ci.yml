name: ci

on:
  push:
  pull_request:

jobs:
  version-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun run check-version

  test:
    runs-on: ubuntu-latest
    needs: version-sync-check
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: cp docker/.env.example .env
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - name: Run unit tests (all packages)
        run: bun run test
      - name: Run API integration tests with coverage (testcontainers)
        run: bun --filter=@aviary/api run test:integration:coverage
      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          working-directory: apps/api
          json-summary-path: apps/api/coverage/coverage-summary.json
          json-final-path: apps/api/coverage/coverage-final.json
      - run: cd apps/worker && uv sync --frozen && uv run pytest -q

  build-containers:
    name: Build containers
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from VERSION
        id: pkg
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build merlin (API server)
        run: |
          docker build -f apps/api/docker/Dockerfile \
            -t merlin \
            -t merlin:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/merlin:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/merlin:${{ steps.pkg.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/merlin:latest \
            .
      - name: Build perch (frontend)
        run: |
          docker build -f apps/web/docker/Dockerfile \
            -t perch \
            -t perch:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/perch:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/perch:${{ steps.pkg.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/perch:latest \
            .
      - name: Build swift (python worker)
        run: |
          docker build -f apps/worker/docker/Dockerfile \
            -t swift \
            -t swift:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/swift:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/swift:${{ steps.pkg.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/swift:latest \
            .
      - name: Push merlin to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/merlin:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/merlin:${{ steps.pkg.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/merlin:latest
      - name: Push perch to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/perch:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/perch:${{ steps.pkg.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/perch:latest
      - name: Push swift to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/swift:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/swift:${{ steps.pkg.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/swift:latest
